name: One-off - delete stale release asset

# Temporary, manually-triggered maintenance workflow: removes the
# pre-automation EE-Lens-v0.10.1.apk asset (id 521884938) from the
# "EE Lens v0.10.1" release (id 373538818), so that release carries only
# the automated app-release.apk that android-build.yml's release job
# publishes and keeps up to date -- the one UpdateChecker.kt should
# unambiguously find. This file is removed again right after it has run
# once; it is not meant to stay in the repo.

on:
  workflow_dispatch:

jobs:
  delete-asset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete asset 521884938 (EE-Lens-v0.10.1.apk)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/emporiumelectric-dotcom/EE-Lens/releases/assets/521884938)
          echo "HTTP status: $status"
          cat response.json
          if [ "$status" != "204" ]; then
            echo "::error::Delete failed with status $status"
            exit 1
          fi
          echo "Deleted asset 521884938 successfully."
