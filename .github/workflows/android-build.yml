name: Android build

# Compiles the app and runs its unit tests on GitHub's own runners. This
# exists because the sandbox that wrote the Supabase cloud-sync changes had
# no way to build the app itself -- its network policy blocks
# dl.google.com, which the Android Gradle Plugin and every AndroidX
# dependency come from. GitHub-hosted runners have no such restriction.
#
# This verifies the app COMPILES and its existing unit tests pass. It does
# not install or run the app, and it never touches Supabase -- exercising
# the Cloud sync screen against the real database still needs a real device
# or emulator, run by a person.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache/restore Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  # Builds a signed release APK and publishes it as a GitHub Release, so the
  # in-app "Check for update" screen (UpdateChecker, reads the repo's latest
  # release) has something real to find. Only runs once build/test above has
  # actually passed, and only for a genuine push to main -- never for a PR or
  # a claude/** branch, and never on a schedule of its own.
  release:
    name: Build signed release APK and publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache/restore Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Fails loudly, before anything else, rather than silently shipping an
      # unsigned build or leaking an empty/malformed secret into a confusing
      # Gradle error later. Passed through env (not inlined into the script
      # text) so a password containing a shell-special character can't break
      # -- or worse, inject into -- this script; never prints the secrets
      # themselves.
      - name: Check signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KEYSTORE_BASE64" ] && missing+=("KEYSTORE_BASE64")
          [ -z "$KEYSTORE_PASSWORD" ] && missing+=("KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && missing+=("KEY_ALIAS")
          [ -z "$KEY_PASSWORD" ] && missing+=("KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secret(s) required to sign the release: ${missing[*]}. Add them under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      # Regenerated fresh every run from the KEYSTORE_BASE64 secret -- the
      # decoded .jks and keystore.properties (which holds the passwords in
      # plain text) are removed again in the cleanup step below, and are
      # never echoed, catted, or uploaded as an artifact anywhere in between.
      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release-keystore.jks

      # Same storeFile/storePassword/keyAlias/keyPassword properties, same
      # keystore.properties path, that app/build.gradle.kts already reads
      # locally -- this is not a new signing config, just this file's
      # content coming from repo secrets instead of a developer's machine.
      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<PROPS
          storeFile=keystore/release-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$ALIAS
          keyPassword=$KEY_PW
          PROPS

      # Every automated release used to tag as plain v<versionName> --
      # app/build.gradle.kts's hand-set base, unchanged by this workflow --
      # so every merge to main published under the exact same tag and
      # "Check for update" could never see a new build. Appending the run
      # number as a further dot-separated *numeric* segment (never a hyphen
      # or any other non-numeric suffix) keeps it comparable: UpdateChecker.
      # isNewer splits on "." and silently drops any segment that isn't a
      # plain integer, so a hyphenated build tag would parse as if that
      # segment were simply missing -- an all-numeric segment instead
      # compares correctly, and $GITHUB_RUN_NUMBER only ever increases for
      # this workflow, so every automated release is genuinely newer than
      # the last one, however the hand-set base changes over time.
      - name: Compute this release's version
        id: version
        run: |
          baseName=$(grep -oP 'versionName\s*=\s*overrideVersionName\s*\?:\s*"\K[^"]+' app/build.gradle.kts)
          baseCode=$(grep -oP 'versionCode\s*=\s*overrideVersionCode\s*\?:\s*\K[0-9]+' app/build.gradle.kts)
          if [ -z "$baseName" ] || [ -z "$baseCode" ]; then
            echo "::error::Could not find the base versionName/versionCode in app/build.gradle.kts" >&2
            exit 1
          fi
          name="$baseName.$GITHUB_RUN_NUMBER"
          code=$((baseCode + GITHUB_RUN_NUMBER))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"

      # Overrides passed straight to Gradle so the APK that actually ships
      # carries this same computed version in its own BuildConfig -- not
      # just the GitHub release tag -- otherwise "You have version X" on the
      # Backup screen would never change after installing it, and the very
      # next automated release would look newer than this one for no reason
      # (see app/build.gradle.kts's overrideVersionCode/overrideVersionName).
      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PoverrideVersionCode=${{ steps.version.outputs.code }} \
            -PoverrideVersionName=${{ steps.version.outputs.name }}

      # Done with the keystore the moment the signed APK exists -- removed
      # here, before the release gets published, rather than deferred to an
      # `if: always()` step at the end of the job.
      - name: Remove decoded keystore and properties
        if: always()
        run: rm -rf keystore keystore.properties

      # UpdateChecker reads tag_name (minus a leading v/V) as the version to
      # compare against BuildConfig.VERSION_NAME, and picks the first asset
      # ending in .apk -- so the tag must stay exactly v<computed versionName>
      # and app-release.apk must be attached. Every run number is unique, so
      # this always publishes a new release/tag rather than updating one.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "EE Lens ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
