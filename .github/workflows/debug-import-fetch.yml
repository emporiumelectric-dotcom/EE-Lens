name: Debug import-from-URL fetch (temporary)

# Throwaway diagnostic for the "14 found, none downloaded" Havells report --
# runs the sandbox-unreachable fetch on GitHub's own runners instead (same
# reason android-build.yml exists). Deleted once the investigation
# concludes; see cloudflare/import-url-proxy/debug-havells-fetch.mjs.

on:
  push:
    branches: ["claude/havells-image-cdn-investigation"]
  workflow_dispatch:

jobs:
  debug-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the reported Havells product page and its candidate images
        run: node cloudflare/import-url-proxy/debug-havells-fetch.mjs "https://havells.com/fans/ceiling-fans/inveno-lx-bldc-ceiling-fan.html?color=7399"
