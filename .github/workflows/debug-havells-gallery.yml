name: Debug Havells gallery JSON (temporary)

# Throwaway diagnostic for the "9-image product gallery missing entirely"
# report -- runs the sandbox-unreachable fetch on GitHub's own runners
# instead (same reason android-build.yml exists). Deleted once the
# investigation concludes; see cloudflare/import-url-proxy/debug-havells-gallery.mjs.

on:
  push:
    branches: ["claude/havells-gallery-json"]
  workflow_dispatch:

jobs:
  debug-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the reported Havells product page and locate its gallery JSON
        run: node cloudflare/import-url-proxy/debug-havells-gallery.mjs "https://havells.com/fans/ceiling-fans/inveno-lx-bldc-ceiling-fan.html?color=7399"
